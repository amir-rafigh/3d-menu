name: ghobadi-dental-demo
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghobadi
      POSTGRES_USER: ghobadi_demo
      POSTGRES_PASSWORD: ghobadi_local_demo_only
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - ghobadi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghobadi_demo -d ghobadi"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  ghobadi_data:
